[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rooler"
version = "0.1.0a1"
description = "Python read API for rooler / cooler files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Max Imakaev", email = "mimakaev@gmail.com" }]
keywords = ["hi-c", "genomics", "cooler", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy", "pandas", "h5py"]

[project.optional-dependencies]
# only needed to READ blosc-compressed coolers written by other tools; rooler writes gzip
blosc = ["hdf5plugin"]

[project.urls]
Homepage = "https://github.com/mimakaev/rooler"
Repository = "https://github.com/mimakaev/rooler"

[tool.setuptools]
packages = ["rooler"]
