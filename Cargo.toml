[package]
name = "rooler"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.75"
description = "Fast, out-of-core engine for Hi-C/micro-C cooler files: cload, merge, zoomify, balance, expected"
authors = ["Max Imakaev <mimakaev@gmail.com>"]
license = "MIT"
repository = "https://github.com/mimakaev/rooler"
homepage = "https://github.com/mimakaev/rooler"
readme = "README.md"
keywords = ["hi-c", "genomics", "cooler", "bioinformatics", "sparse-matrix"]
categories = ["science", "command-line-utilities"]
exclude = ["docs/*", "scripts/*", "target/*"]

[dependencies]
hdf5 = { package = "hdf5-metno", version = "0.9", features = ["blosc"] }
ndarray = "0.16"
lz4_flex = "0.11"
blosc-src = { version = "0.3.8", features = ["lz4", "zstd"] }
rayon = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
memchr = "2"
rustfft = "6"
num-complex = "0.4"
libdeflater = "1.25.2"
hdf5-metno-sys = "0.10.1"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
