name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rooler links against the system libhdf5 (the hdf5-metno crate finds it via pkg-config)
      - name: Install libhdf5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-targets

      - name: Test
        # the integration test generates its own data; no fixtures or network needed
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
        continue-on-error: true

  python:
    name: python read API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ./python
      - name: Import check
        run: python -c "import rooler; print('rooler', rooler.__version__)"
