name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rooler links against the system libhdf5 (the hdf5-metno crate finds it via pkg-config)
      - name: Install libhdf5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-targets

      - name: Test
        # the integration test generates its own data; no fixtures or network needed
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
        continue-on-error: true

  python:
    name: python read API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libhdf5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install ./python pytest cooler

      # the accessor tests build their own fixture with the rooler binary, and check every
      # table against cooler's own accessors
      - name: Build binaries for the fixture
        run: cargo build --release --bin rooler --example genpairs

      - name: Test
        env:
          ROOLER: target/release/rooler
          GENPAIRS: target/release/examples/genpairs
        run: pytest python/tests -q
